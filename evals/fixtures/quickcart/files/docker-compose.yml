services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickcart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quickcart
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  web:
    build: ./frontend
    ports:
      - "3000:80"

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:
